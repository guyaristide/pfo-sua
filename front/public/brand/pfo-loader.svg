<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="56" height="56" role="img" aria-label="Chargement en cours">
  <style>
    .segment { fill: #1E2D6E; opacity: .16; animation: sweep 1.6s cubic-bezier(.45,0,.25,1) infinite; }
    .s2 { animation-delay: .4s; } .s3 { animation-delay: .8s; } .s4 { animation-delay: 1.2s; }
    .core { fill: none; stroke: #1E2D6E; stroke-width: 1.2; transform-origin: 50% 50%; animation: breathe 1.6s ease-in-out infinite; }
    @keyframes sweep { 0% { opacity: .16; } 18%, 55% { opacity: 1; } 80%, 100% { opacity: .16; } }
    @keyframes breathe { 0%, 100% { transform: scale(.72); opacity: .15; } 50% { transform: scale(1); opacity: .45; } }
    @media (prefers-reduced-motion: reduce) { .segment { animation: none; opacity: 1; } .core { display: none; } }
  </style>
  <rect class="segment s1" x="10" y="10" width="62" height="18"/>
  <rect class="segment s2" x="72" y="10" width="18" height="62"/>
  <rect class="segment s3" x="28" y="72" width="62" height="18"/>
  <rect class="segment s4" x="10" y="28" width="18" height="62"/>
  <rect class="core" x="34" y="34" width="32" height="32"/>
</svg>
